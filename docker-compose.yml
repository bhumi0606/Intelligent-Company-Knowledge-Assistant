services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-assistant-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MCP_SERVER_URL: http://weather-mcp:8080/mcp
    depends_on:
      - postgres
      - weather-mcp

  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bhumi
      POSTGRES_DB: knowledge_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  weather-mcp:
    build:
      context: ./weather-mcp
      dockerfile: Dockerfile
    container_name: weather-mcp
    ports:
      - "8080:8080"
    environment:
      AUTH_ENABLED: "false"

volumes:
  postgres_data: